name: Analyses

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clinical-trial-survival:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-clinical-trial-survival
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::survival
            any::dplyr
            any::ggplot2
            any::patchwork
            any::knitr
            any::scales
            any::testthat
      - name: Unit tests
        run: Rscript -e 'testthat::test_dir("tests", stop_on_failure = TRUE)'
      - name: Run full analysis
        run: Rscript run_all.R

  credit-risk-scorecard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-credit-risk-scorecard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 02-credit-risk-scorecard/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q tests
      - name: Run full analysis
        run: python run_all.py

  nyc-flights-sql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-nyc-flights-sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 03-nyc-flights-sql/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q tests
      - name: Build database and run all queries
        run: python build_db.py && python run_queries.py
