name: R analysis

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clinical-trial-survival:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-clinical-trial-survival
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::survival
            any::dplyr
            any::ggplot2
            any::patchwork
            any::knitr
            any::scales
            any::testthat
      - name: Unit tests
        run: Rscript -e 'testthat::test_dir("tests", stop_on_failure = TRUE)'
      - name: Run full analysis
        run: Rscript run_all.R
